<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Traceworks — Parts, specified precisely.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Design tokens ----------
  Paper (bg)     #F6F5F1   blueprint paper, warm off-white
  Ink (text)     #14181F   near-black drafting ink
  Grid line      #D8DEE6   faint blueprint grid
  Blue (accent)  #2454D6   schematic-blue, primary
  Amber (accent) #E8A33D   solder/resistor amber, CTA
  Slate (muted)  #5B6472
  Display font:  Space Grotesk
  Body font:     Inter
  Data/mono:     JetBrains Mono
  Signature:     orthogonal circuit-trace dividers with via-dots, plus
                 blueprint corner registration marks on every panel.
  ------------------------------------ */
  :root{
    --paper:#F6F5F1; --ink:#14181F; --grid:#D8DEE6;
    --blue:#2454D6; --amber:#E8A33D; --slate:#5B6472;
    --panel:#FFFFFF; --chip:#F0EEE8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .font-display{font-family:'Space Grotesk',sans-serif;}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  img,svg{display:block;}
  .container{max-width:1280px;margin:0 auto;padding:0 24px;}
  @media(min-width:768px){.container{padding:0 40px;}}

  /* focus + motion */
  button:focus-visible, a:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  /* buttons */
  .btn{font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.12em;
       padding:12px 24px;border-radius:2px;border:none;transition:transform .15s ease;}
  .btn:hover{transform:translateY(-2px);}
  .btn-dark{background:var(--ink);color:var(--paper);}
  .btn-outline{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  .btn-amber{background:var(--amber);color:var(--ink);}
  .btn-link{background:none;border:none;color:var(--blue);font-family:'JetBrains Mono',monospace;
       font-size:11px;text-transform:uppercase;letter-spacing:.12em;display:inline-flex;align-items:center;gap:4px;padding:0;}

  /* grid backdrop (blueprint paper) */
  .grid-bg{background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                            linear-gradient(90deg, var(--grid) 1px, transparent 1px);
           background-size:32px 32px;}

  /* corner registration marks */
  .corner-marks{position:relative;}
  .corner-mark{position:absolute;width:14px;height:14px;opacity:.28;pointer-events:none;}
  .corner-mark::before{content:'';position:absolute;top:0;left:6px;width:1px;height:14px;background:var(--ink);}
  .corner-mark::after{content:'';position:absolute;top:6px;left:0;width:14px;height:1px;background:var(--ink);}
  .corner-mark.tl{top:-7px;left:-7px;} .corner-mark.tr{top:-7px;right:-7px;}
  .corner-mark.bl{bottom:-7px;left:-7px;} .corner-mark.br{bottom:-7px;right:-7px;}

  /* header */
  header.site{position:sticky;top:0;z-index:40;background:rgba(246,245,241,.92);backdrop-filter:blur(6px);
              border-bottom:1px solid var(--grid);}
  .header-inner{height:80px;display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:baseline;gap:6px;background:none;border:none;}
  .logo .name{font-size:24px;color:var(--ink);}
  .logo .ver{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--blue);}
  nav.primary{display:none;gap:32px;font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.12em;}
  @media(min-width:768px){nav.primary{display:flex;}}
  nav.primary button{background:none;border:none;padding-bottom:4px;border-bottom:2px solid transparent;color:var(--slate);}
  nav.primary button.active{color:var(--ink);border-bottom-color:var(--blue);}
  .header-actions{display:flex;align-items:center;gap:12px;}
  .cart-btn{position:relative;display:flex;align-items:center;gap:8px;}
  .cart-badge{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--amber);
              color:var(--ink);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;}
  .menu-toggle{display:flex;background:none;border:none;}
  @media(min-width:768px){.menu-toggle{display:none;}}
  .mobile-nav{display:none;flex-direction:column;gap:12px;padding:0 24px 16px;font-family:'JetBrains Mono',monospace;
              font-size:12px;text-transform:uppercase;letter-spacing:.12em;}
  .mobile-nav.open{display:flex;}
  .mobile-nav button{background:none;border:none;text-align:left;color:var(--slate);}
  .mobile-nav button.active{color:var(--ink);}

  /* hero */
  .hero{padding:64px 0 80px;}
  @media(min-width:768px){.hero{padding:96px 0 80px;}}
  .hero-grid{display:grid;grid-template-columns:1fr;gap:48px;align-items:center;}
  @media(min-width:768px){.hero-grid{grid-template-columns:1fr 1fr;}}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.25em;color:var(--blue);margin-bottom:20px;}
  h1.hero-title{font-size:44px;line-height:1.05;margin:0 0 24px;color:var(--ink);}
  @media(min-width:768px){h1.hero-title{font-size:58px;}}
  .hero-sub{font-size:17px;color:var(--slate);max-width:420px;margin:0 0 32px;}
  .hero-ctas{display:flex;gap:16px;flex-wrap:wrap;}
  .hero-panel{position:relative;background:var(--panel);border:1px solid var(--grid);border-radius:2px;padding:32px;max-width:320px;margin:0 auto;}
  .hero-panel .spec-lines{margin-top:16px;font-size:10px;line-height:1.8;color:var(--slate);}

  /* section headings */
  .section{padding:56px 0;}
  h2.section-title{font-size:28px;color:var(--ink);margin:0 0 32px;}
  @media(min-width:768px){h2.section-title{font-size:32px;}}
  .section-head-row{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:32px;}

  /* category tiles */
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  @media(min-width:768px){.cat-grid{grid-template-columns:repeat(4,1fr);}}
  .cat-tile{position:relative;background:var(--panel);border:1px solid var(--grid);border-radius:2px;padding:24px;
            display:flex;flex-direction:column;align-items:center;gap:12px;transition:transform .15s ease;}
  .cat-tile:hover{transform:translateY(-3px);}
  .cat-tile .icon{width:56px;height:56px;}
  .cat-tile span{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;text-align:center;}

  /* product grid + card */
  .product-grid{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:640px){.product-grid{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1024px){.product-grid{grid-template-columns:repeat(4,1fr);}}
  .product-grid.cols-3{grid-template-columns:1fr;}
  @media(min-width:640px){.product-grid.cols-3{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1024px){.product-grid.cols-3{grid-template-columns:repeat(3,1fr);}}
  .product-card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--grid);border-radius:2px;
                padding:20px;display:flex;flex-direction:column;width:100%;transition:transform .15s ease;}
  .product-card:hover{transform:translateY(-4px);}
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .tag-mono{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--slate);}
  .price-chip{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--chip);color:var(--ink);padding:2px 8px;border-radius:2px;}
  .card-icon{display:flex;align-items:center;justify-content:center;padding:24px 0;}
  .card-icon .icon{width:96px;height:96px;}
  .card-title{font-size:18px;line-height:1.2;margin:0 0 4px;color:var(--ink);}
  .card-tagline{font-size:14px;color:var(--slate);margin:0 0 12px;}
  .card-link{margin-top:auto;display:inline-flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);}

  /* trust strip */
  .trust-grid{display:grid;grid-template-columns:1fr;gap:32px;}
  @media(min-width:640px){.trust-grid{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1024px){.trust-grid{grid-template-columns:repeat(4,1fr);}}
  .trust-item{display:flex;align-items:flex-start;gap:12px;}
  .trust-item p{font-size:14px;color:var(--slate);margin:0;}
  .trust-item svg{margin-top:2px;flex-shrink:0;}

  /* breadcrumb */
  .breadcrumb{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;
              color:var(--slate);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .breadcrumb button{background:none;border:none;color:var(--slate);}
  .breadcrumb button:hover{text-decoration:underline;}
  .breadcrumb .current{color:var(--ink);}

  /* filter pills */
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 32px;}
  .pill{font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.1em;
       padding:8px 16px;border-radius:2px;border:1px solid var(--grid);background:transparent;color:var(--slate);}
  .pill.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  /* product detail */
  .detail-grid{display:grid;grid-template-columns:1fr;gap:48px;margin-top:24px;}
  @media(min-width:768px){.detail-grid{grid-template-columns:1fr 1fr;}}
  .detail-panel{position:relative;background:var(--panel);border:1px solid var(--grid);border-radius:2px;
                padding:40px;display:flex;align-items:center;justify-content:center;}
  .detail-panel .icon{width:256px;height:256px;max-width:100%;}
  .detail-price{font-family:'JetBrains Mono',monospace;font-size:26px;margin:0 0 24px;color:var(--ink);}
  .spec-table{border-top:1px solid var(--grid);border-bottom:1px solid var(--grid);margin-bottom:24px;}
  .spec-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--grid);
            font-family:'JetBrains Mono',monospace;font-size:12px;}
  .spec-row:first-child{border-top:none;}
  .spec-row .label{color:var(--slate);}
  .spec-row .value{color:var(--ink);}
  .qty-row{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .qty-control{display:flex;align-items:center;border:1px solid var(--grid);border-radius:2px;}
  .qty-control button{background:none;border:none;padding:12px;}
  .qty-control span{font-family:'JetBrains Mono',monospace;font-size:14px;width:32px;text-align:center;}
  .in-stock{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--blue);display:flex;align-items:center;gap:6px;}

  /* cart */
  .cart-empty{padding:64px 0;text-align:center;border:1px solid var(--grid);border-radius:2px;}
  .cart-empty p{font-size:14px;color:var(--slate);margin-bottom:16px;}
  .cart-layout{display:grid;grid-template-columns:1fr;gap:40px;}
  @media(min-width:768px){.cart-layout{grid-template-columns:2fr 1fr;}}
  .cart-item{display:flex;align-items:center;gap:16px;border:1px solid var(--grid);border-radius:2px;padding:16px;background:var(--panel);margin-bottom:16px;}
  .cart-item .thumb{width:64px;height:64px;flex-shrink:0;border-radius:2px;background:var(--chip);display:flex;align-items:center;justify-content:center;}
  .cart-item .thumb .icon{width:40px;height:40px;}
  .cart-item .info{flex:1;min-width:0;}
  .cart-item .info p.name{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cart-item .info p.unit{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--slate);margin:2px 0 0;}
  .cart-item .qty-control button{padding:8px;}
  .cart-item .qty-control span{width:24px;font-size:12px;}
  .cart-item .line-total{font-family:'JetBrains Mono',monospace;font-size:14px;width:70px;text-align:right;color:var(--ink);}
  .summary-panel{border:1px solid var(--grid);border-radius:2px;padding:24px;background:var(--panel);height:fit-content;}
  .summary-panel h2{font-size:20px;margin:0 0 16px;}
  .summary-row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--grid);
              font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--slate);}
  .summary-row .val{color:var(--ink);}
  .summary-row.total{font-size:14px;color:var(--ink);padding-top:12px;margin-top:4px;}
  .summary-panel .btn{width:100%;margin-top:16px;}

  /* about steps */
  .steps-grid{display:grid;grid-template-columns:1fr;gap:24px;margin-bottom:56px;}
  @media(min-width:640px){.steps-grid{grid-template-columns:1fr 1fr;}}
  .step-card{position:relative;border:1px solid var(--grid);border-radius:2px;padding:24px;background:var(--panel);}
  .step-card .step-n{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--blue);}
  .step-card h3{font-size:18px;margin:8px 0;}
  .step-card p{font-size:14px;color:var(--slate);margin:0;}

  /* footer */
  footer.site{padding:56px 0 40px;margin-top:40px;}
  .footer-row{display:flex;flex-direction:column;justify-content:space-between;gap:24px;margin-top:32px;}
  @media(min-width:768px){.footer-row{flex-direction:row;}}
  .footer-row .brand p{font-size:14px;color:var(--slate);max-width:280px;margin:8px 0 0;}
  .footer-links{display:flex;gap:32px;font-family:'JetBrains Mono',monospace;font-size:12px;text-transform:uppercase;letter-spacing:.1em;}
  .footer-links button{background:none;border:none;color:var(--slate);}
  .footer-links button:hover{color:var(--ink);}
  .copyright{font-family:'JetBrains Mono',monospace;font-size:10px;color:#9AA3AF;margin-top:40px;}

  /* toast */
  #toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);padding:12px 20px;border-radius:2px;
        background:var(--ink);color:var(--paper);font-family:'JetBrains Mono',monospace;font-size:12px;
        z-index:50;opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;box-shadow:0 12px 24px rgba(0,0,0,.15);}
  #toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<header class="site">
  <div class="container header-inner">
    <button class="logo" onclick="goTo('home')">
      <span class="font-display name">Traceworks</span>
      <span class="font-mono ver">v2.6</span>
    </button>
    <nav class="primary" id="primary-nav"></nav>
    <div class="header-actions">
      <button class="btn btn-dark cart-btn" onclick="goTo('cart')">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Cart
        <span class="cart-badge" id="cart-badge" style="display:none;">0</span>
      </button>
      <button class="menu-toggle" onclick="toggleMenu()" aria-label="Toggle menu">
        <svg id="menu-icon-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg id="menu-icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" style="display:none;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="mobile-nav" id="mobile-nav"></div>
</header>

<main id="page-root"></main>

<footer class="site">
  <div class="container">
    <div id="footer-trace"></div>
    <div class="footer-row">
      <div class="brand">
        <span class="font-display" style="font-size:20px;">Traceworks</span>
        <p>Parts, specified precisely. Bench-tested before it ships.</p>
      </div>
      <div class="footer-links">
        <button onclick="goTo('shop')">Shop</button>
        <button onclick="goTo('about')">About</button>
        <button onclick="goTo('cart')">Cart</button>
      </div>
    </div>
    <p class="copyright">© 2026 Traceworks Components Co. — every part, on the record.</p>
  </div>
</footer>

<div id="toast" role="status"></div>

<script>
/* ---------- data ---------- */
const CATEGORIES = [
  { key: "cpu", label: "Processors" },
  { key: "gpu", label: "Graphics Cards" },
  { key: "ram", label: "Memory" },
  { key: "storage", label: "Storage" },
  { key: "motherboard", label: "Motherboards" },
  { key: "psu", label: "Power Supplies" },
  { key: "cooling", label: "Cooling" },
  { key: "case", label: "Cases" },
];

const BLUE = "#2454D6", AMBER = "#E8A33D", INK = "#14181F";

const PRODUCTS = [
  { id:"vertex-9950x", name:"Vertex 9950X", category:"cpu", tagline:"16-core desktop processor", price:549, accent:BLUE,
    specs:[["Socket","AM5"],["Cores / Threads","16 / 32"],["Base Clock","4.2 GHz"],["Boost Clock","5.7 GHz"],["TDP","170 W"],["Cache","80 MB"]] },
  { id:"vertex-7500f", name:"Vertex 5 7500F", category:"cpu", tagline:"6-core desktop processor", price:179, accent:BLUE,
    specs:[["Socket","AM5"],["Cores / Threads","6 / 12"],["Base Clock","3.7 GHz"],["Boost Clock","4.8 GHz"],["TDP","65 W"],["Cache","32 MB"]] },
  { id:"aurora-4070ti-super", name:"Aurora 4070 Ti Super 16GB", category:"gpu", tagline:"High-refresh 1440p / 4K graphics card", price:799, accent:AMBER,
    specs:[["Memory","16 GB GDDR6X"],["Bus width","256-bit"],["Boost Clock","2610 MHz"],["TDP","285 W"],["Outputs","3x DP, 1x HDMI"],["Length","336 mm"]] },
  { id:"aurora-7800xt", name:"Aurora 7800 XT 16GB", category:"gpu", tagline:"1440p performance graphics card", price:549, accent:AMBER,
    specs:[["Memory","16 GB GDDR6"],["Bus width","256-bit"],["Boost Clock","2430 MHz"],["TDP","263 W"],["Outputs","2x DP, 2x HDMI"],["Length","308 mm"]] },
  { id:"latch-ddr5-6000-32", name:"Latch DDR5-6000 32GB Kit", category:"ram", tagline:"2 x 16GB desktop memory kit", price:129, accent:BLUE,
    specs:[["Speed","DDR5-6000"],["Latency","CL30"],["Capacity","32 GB (2x16GB)"],["Voltage","1.35 V"],["Profile","Low-profile heat spreader"]] },
  { id:"strata-2tb-nvme", name:"Strata 2TB NVMe Gen4 SSD", category:"storage", tagline:"M.2 solid-state drive", price:149, accent:AMBER,
    specs:[["Capacity","2 TB"],["Interface","PCIe 4.0 x4"],["Sequential read","7,000 MB/s"],["Sequential write","6,500 MB/s"],["Form factor","M.2 2280"]] },
  { id:"steady-850-gold", name:"Steady 850W 80+ Gold", category:"psu", tagline:"Fully modular power supply", price:119, accent:BLUE,
    specs:[["Wattage","850 W"],["Efficiency","80+ Gold"],["Modularity","Fully modular"],["Fan","135 mm fluid dynamic"],["Warranty","10 years"]] },
  { id:"updraft-360-aio", name:"Updraft 360 AIO Liquid Cooler", category:"cooling", tagline:"360mm all-in-one liquid cooler", price:159, accent:AMBER,
    specs:[["Radiator","360 mm"],["Fans","3x 120mm PWM"],["Socket support","AM5 / AM4 / LGA1700"],["Noise level","26 dBA"],["Pump speed","2800 RPM"]] },
  { id:"baseplate-z-atx", name:"Baseplate Z-Series ATX", category:"motherboard", tagline:"ATX motherboard", price:279, accent:BLUE,
    specs:[["Form factor","ATX"],["Socket","LGA1700"],["Memory","4x DDR5, up to 192GB"],["Expansion","PCIe 5.0 x16"],["Storage","4x M.2 slots"]] },
  { id:"framework-mid-tower", name:"Framework Mid-Tower ATX", category:"case", tagline:"Mid-tower ATX case", price:99, accent:AMBER,
    specs:[["Form factor","Mid-tower ATX"],["Max GPU length","400 mm"],["Front I/O","USB-C + 2x USB-A"],["Included fans","3"],["Side panel","Tempered glass"]] },
];

function formatPrice(n){ return "£" + n.toLocaleString("en-GB"); }
function categoryLabel(key){ const c = CATEGORIES.find(c=>c.key===key); return c ? c.label : key; }

/* ---------- icons (schematic line-art) ---------- */
function pinsSVG(side, count, gap, color, box){
  const [x0,y0,x1,y1] = box, len = 6; let s = "";
  for(let i=0;i<count;i++){
    if(side==="top"||side==="bottom"){
      const x = x0+gap+i*((x1-x0-gap*2)/(count-1));
      const y = side==="top" ? y0 : y1;
      const y2 = side==="top" ? y0-len : y1+len;
      s += `<line x1="${x}" y1="${y}" x2="${x}" y2="${y2}" stroke="${color}" stroke-width="1.4"/>`;
    } else {
      const y = y0+gap+i*((y1-y0-gap*2)/(count-1));
      const x = side==="left" ? x0 : x1;
      const x2 = side==="left" ? x0-len : x1+len;
      s += `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y}" stroke="${color}" stroke-width="1.4"/>`;
    }
  }
  return s;
}
const svgOpen = (vb,color) => `<svg viewBox="${vb}" class="icon" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">`;
const ICONS = {
  cpu: (color) => `${svgOpen("0 0 120 120",color)}

    <line x1="25" y1="88" x2="95" y2="88" stroke-opacity="0.5"/><line x1="25" y1="94" x2="95" y2="94" stroke-opacity="0.5"/>

/* signature: circuit-trace divider */
function traceDividerSVG(color, opacity){
  color = color || BLUE; opacity = opacity===undefined ? 0.5 : opacity;
  const via = [120,260,420,560,700,840];
  return `<svg viewBox="0 0 1000 24" preserveAspectRatio="none" style="width:100%;height:24px;" aria-hidden="true">
    <path d="M0 12 H120 V4 H260 V20 H420 V12 H560 V4 H700 V20 H840 V12 H1000" fill="none" stroke="${color}" stroke-opacity="${opacity}" stroke-width="1.5"/>
    ${via.map((x,i)=>`<circle cx="${x}" cy="${i%2===0?12:(i%4===1?4:20)}" r="3" fill="${color}" fill-opacity="${opacity+0.15}"/>`).join("")}
  </svg>`;
}
const CORNER_MARKS = `<span class="corner-mark tl"></span><span class="corner-mark tr"></span><span class="corner-mark bl"></span><span class="corner-mark br"></span>`;
const CHECK_SVG = (color) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const ARROW_R = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;
const ARROW_L = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>`;
const MINUS_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>`;
const PLUS_SVG = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`;

/* ---------- state ---------- */
const state = { page:"home", category:"all", productId: PRODUCTS[0].id, productQty:1, cart:[], menuOpen:false };

/* ---------- helpers ---------- */
function productCardHTML(p){
  return `
  <button class="corner-marks product-card" onclick="goTo('product',{productId:'${p.id}'})">
    ${CORNER_MARKS}
    <div class="card-top">
      <span class="tag-mono">${categoryLabel(p.category)}</span>
      <span class="price-chip">${formatPrice(p.price)}</span>
    </div>
    <div class="card-icon">${ICONS[p.category](p.accent)}</div>
    <h3 class="font-display card-title">${p.name}</h3>
    <p class="card-tagline">${p.tagline}</p>
    <span class="card-link">View spec ${ARROW_R}</span>
  </button>`;
}
function breadcrumbHTML(items){
  return `<div class="breadcrumb">${items.map((it,i)=>`${i>0?"<span>/</span>":""}${it.onclick ? `<button onclick="${it.onclick}">${it.label}</button>` : `<span class="current">${it.label}</span>`}`).join("")}</div>`;
}

/* ---------- page renderers ---------- */
function renderHome(){
  const featured = PRODUCTS.slice(0,4);
  return `
  <section class="hero grid-bg">
    <div class="container hero-grid">
      <div>
        <p class="eyebrow font-mono">Rev. 2026 — spec-checked parts</p>
        <h1 class="hero-title font-display">Build it exactly right.</h1>
        <p class="hero-sub">Traceworks sells the parts, not the hype. Every listing carries full specs and a compatibility note, the way a datasheet should read.</p>
        <div class="hero-ctas">
          <button class="btn btn-dark" onclick="goTo('shop')">Shop components</button>
          <button class="btn btn-outline" onclick="goTo('about')">How we test</button>
        </div>
      </div>
      <div class="corner-marks hero-panel">
        ${CORNER_MARKS}
        ${ICONS.motherboard(BLUE).replace('class="icon"','class="icon" style="width:100%;height:224px;"')}
        <div class="spec-lines font-mono">
          <div>FORM — ATX</div><div>SOCKET — LGA1700</div><div>PCIE — GEN 5</div>
        </div>
      </div>
    </div>
  </section>

  <div class="container">${traceDividerSVG()}</div>

  <section class="section container">
    <h2 class="section-title font-display">Shop by category</h2>
    <div class="cat-grid">
      ${CATEGORIES.map(c=>`
        <button class="corner-marks cat-tile" onclick="goTo('shop',{category:'${c.key}'})">
          ${CORNER_MARKS}
          ${ICONS[c.key](INK)}
          <span class="font-mono">${c.label}</span>
        </button>`).join("")}
    </div>
  </section>

  <section class="section container">
    <div class="section-head-row">
      <h2 class="section-title font-display" style="margin:0;">Featured this week</h2>
      <button class="btn-link" onclick="goTo('shop')">View all ${ARROW_R}</button>
    </div>
    <div class="product-grid">${featured.map(productCardHTML).join("")}</div>
  </section>

  <div class="container">${traceDividerSVG(AMBER)}</div>

  <section class="section container trust-grid">
    ${["Bench-tested for 72 hours before listing","Compatibility notes on every spec sheet","Ships in anti-static, drop-tested packaging","Fits standard ATX / mATX / ITX form factors"]
      .map(t=>`<div class="trust-item">${CHECK_SVG(BLUE)}<p>${t}</p></div>`).join("")}
  </section>`;
}

function renderShop(){
  const active = state.category;
  const filtered = active==="all" ? PRODUCTS : PRODUCTS.filter(p=>p.category===active);
  return `
  <div class="container" style="padding-top:40px;padding-bottom:40px;">
    ${breadcrumbHTML([{label:"Home",onclick:"goTo('home')"},{label:"Shop"}])}
    <div class="section-head-row" style="margin-top:16px;">
      <h1 class="section-title font-display" style="margin:0;">All components</h1>
      <span class="font-mono" style="font-size:12px;color:var(--slate);">${filtered.length} listed</span>
    </div>
    <div class="pill-row">
      <button class="pill ${active==="all"?"active":""}" onclick="setShopCategory('all')">All</button>
      ${CATEGORIES.map(c=>`<button class="pill ${active===c.key?"active":""}" onclick="setShopCategory('${c.key}')">${c.label}</button>`).join("")}
    </div>
    ${filtered.length===0
      ? `<p style="font-size:14px;color:var(--slate);">No parts in this category yet.</p>`
      : `<div class="product-grid">${filtered.map(productCardHTML).join("")}</div>`}
  </div>`;
}

function renderProduct(){
  const product = PRODUCTS.find(p=>p.id===state.productId) || PRODUCTS[0];
  const related = PRODUCTS.filter(p=>p.category===product.category && p.id!==product.id).slice(0,3);
  return `
  <div class="container" style="padding-top:40px;padding-bottom:40px;">
    ${breadcrumbHTML([
      {label:"Home",onclick:"goTo('home')"},
      {label:categoryLabel(product.category),onclick:`goTo('shop',{category:'${product.category}'})`},
      {label:product.name}
    ])}
    <div class="detail-grid">
      <div class="corner-marks detail-panel grid-bg">${CORNER_MARKS}${ICONS[product.category](product.accent)}</div>
      <div>
        <span class="tag-mono font-mono">${categoryLabel(product.category)}</span>
        <h1 class="font-display" style="font-size:34px;margin:8px 0 8px;">${product.name}</h1>
        <p style="font-size:16px;color:var(--slate);margin:0 0 16px;">${product.tagline}</p>
        <p class="detail-price font-mono">${formatPrice(product.price)}</p>
        <div class="spec-table">
          ${product.specs.map(([label,value])=>`<div class="spec-row"><span class="label">${label}</span><span class="value">${value}</span></div>`).join("")}
        </div>
        <div class="qty-row">
          <div class="qty-control">
            <button onclick="changeProductQty(-1)" aria-label="Decrease quantity">${MINUS_SVG}</button>
            <span>${state.productQty}</span>
            <button onclick="changeProductQty(1)" aria-label="Increase quantity">${PLUS_SVG}</button>
          </div>
          <button class="btn btn-dark" style="flex:1;" onclick="addToCart('${product.id}', ${state.productQty})">Add to cart</button>
        </div>
        <p class="in-stock">${CHECK_SVG(BLUE)} In stock — ships in 1–2 business days</p>
      </div>
    </div>
    ${related.length>0 ? `
      <div style="margin-top:64px;">
        ${traceDividerSVG()}
        <h2 class="font-display" style="font-size:26px;margin:32px 0 24px;">Related ${categoryLabel(product.category).toLowerCase()}</h2>
        <div class="product-grid cols-3">${related.map(productCardHTML).join("")}</div>
      </div>` : ""}
  </div>`;
}

function renderCart(){
  const items = state.cart.map(c=>({...c, product: PRODUCTS.find(p=>p.id===c.id)}));
  const subtotal = items.reduce((s,i)=>s+i.product.price*i.qty,0);
  const shipping = subtotal===0 ? 0 : (subtotal>500 ? 0 : 12);
  const total = subtotal + shipping;
  return `
  <div class="container" style="padding-top:40px;padding-bottom:40px;">
    ${breadcrumbHTML([{label:"Home",onclick:"goTo('home')"},{label:"Cart"}])}
    <h1 class="font-display" style="font-size:34px;margin:16px 0 32px;">Your cart</h1>
    ${items.length===0 ? `
      <div class="cart-empty">
        <p>Nothing here yet.</p>
        <button class="btn btn-dark" onclick="goTo('shop')">Shop components</button>
      </div>` : `
      <div class="cart-layout">
        <div>
          ${items.map(({id,qty,product})=>`
            <div class="cart-item">
              <div class="thumb">${ICONS[product.category](product.accent)}</div>
              <div class="info">
                <p class="name font-display">${product.name}</p>
                <p class="unit font-mono">${formatPrice(product.price)} each</p>
              </div>
              <div class="qty-control">
                <button onclick="changeQty('${id}',-1)" aria-label="Decrease quantity">${MINUS_SVG}</button>
                <span>${qty}</span>
                <button onclick="changeQty('${id}',1)" aria-label="Increase quantity">${PLUS_SVG}</button>
              </div>
              <span class="line-total font-mono">${formatPrice(product.price*qty)}</span>
            </div>`).join("")}
          <button class="btn-link" style="margin-top:8px;" onclick="goTo('shop')">${ARROW_L} Continue shopping</button>
        </div>
        <div class="summary-panel">
          <h2 class="font-display">Summary</h2>
          <div class="summary-row"><span>Subtotal</span><span class="val">${formatPrice(subtotal)}</span></div>
          <div class="summary-row"><span>Shipping</span><span class="val">${shipping===0?"Free":formatPrice(shipping)}</span></div>
          <div class="summary-row total"><span>Total</span><span class="val">${formatPrice(total)}</span></div>
          <button class="btn btn-amber" onclick="checkout()">Checkout</button>
        </div>
      </div>`}
  </div>`;
}

function renderAbout(){
  const steps = [
    { label:"Bench burn-in", body:"Every board and card runs a 72-hour load test before it's listed for sale." },
    { label:"Compatibility check", body:"We verify socket, form factor, and clearance against our reference builds." },
    { label:"Thermal validation", body:"Parts are tested under sustained load, not just idle, to catch throttling early." },
    { label:"Static-safe packaging", body:"Anti-static bags, foam corners, and a drop-tested outer box for every order." },
  ];
  return `
  <div class="container" style="padding-top:40px;padding-bottom:40px;">
    ${breadcrumbHTML([{label:"Home",onclick:"goTo('home')"},{label:"About"}])}
    <h1 class="font-display" style="font-size:34px;margin:16px 0 24px;">Parts, specified precisely.</h1>
    <p style="max-width:640px;font-size:16px;color:var(--slate);margin-bottom:56px;">
      Traceworks started on a home workbench, tired of spec sheets that left out the one number that actually mattered.
      We test what we sell, and we write the datasheet the way we'd want to read it.
    </p>
    <h2 class="font-display" style="font-size:26px;margin-bottom:32px;">How we test</h2>
    <div class="steps-grid">
      ${steps.map((s,i)=>`
        <div class="corner-marks step-card">
          ${CORNER_MARKS}
          <span class="step-n font-mono">STEP ${String(i+1).padStart(2,"0")}</span>
          <h3 class="font-display">${s.label}</h3>
          <p>${s.body}</p>
        </div>`).join("")}
    </div>
    ${traceDividerSVG(AMBER)}
    <div style="margin-top:40px;text-align:center;">
      <button class="btn btn-dark" onclick="goTo('shop')">Shop components</button>
    </div>
  </div>`;
}

/* ---------- routing / state actions ---------- */
function render(){
  const root = document.getElementById("page-root");
  if(state.page==="home") root.innerHTML = renderHome();
  else if(state.page==="shop") root.innerHTML = renderShop();
  else if(state.page==="product") root.innerHTML = renderProduct();
  else if(state.page==="cart") root.innerHTML = renderCart();
  else if(state.page==="about") root.innerHTML = renderAbout();
  updateChrome();
}
function updateChrome(){
  const navItems = [["home","Home"],["shop","Shop"],["about","About"]];
  document.getElementById("primary-nav").innerHTML = navItems.map(([key,label])=>
    `<button class="${state.page===key?"active":""}" onclick="goTo('${key}')">${label}</button>`).join("");
  document.getElementById("mobile-nav").innerHTML = navItems.map(([key,label])=>
    `<button class="${state.page===key?"active":""}" onclick="goTo('${key}')">${label}</button>`).join("");
  document.getElementById("mobile-nav").classList.toggle("open", state.menuOpen);
  document.getElementById("menu-icon-open").style.display = state.menuOpen ? "none" : "block";
  document.getElementById("menu-icon-close").style.display = state.menuOpen ? "block" : "none";
  const count = state.cart.reduce((s,c)=>s+c.qty,0);
  const badge = document.getElementById("cart-badge");
  badge.textContent = count;
  badge.style.display = count>0 ? "flex" : "none";
  document.getElementById("footer-trace").innerHTML = traceDividerSVG();
}
function goTo(page, opts={}){
  if(opts.category) state.category = opts.category;
  if(opts.productId){ state.productId = opts.productId; state.productQty = 1; }
  state.page = page;
  state.menuOpen = false;
  render();
  window.scrollTo({top:0, behavior:"instant"});
}
function setShopCategory(cat){ state.category = cat; render(); }
function toggleMenu(){ state.menuOpen = !state.menuOpen; render(); }
function changeProductQty(delta){ state.productQty = Math.max(1, state.productQty + delta); render(); }
function addToCart(id, qty){
  qty = qty || 1;
  const existing = state.cart.find(c=>c.id===id);
  if(existing) existing.qty += qty; else state.cart.push({id, qty});
  showToast("Added to cart");
  render();
}
function changeQty(id, delta){
  state.cart = state.cart.map(c=>c.id===id ? {...c, qty:c.qty+delta} : c).filter(c=>c.qty>0);
  render();
}
function checkout(){ showToast("This is a demo — no real checkout here."); }
function showToast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

render();
</script>
</body>
</html>
